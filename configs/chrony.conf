# /etc/chrony/chrony.conf
# GPS-disciplined Stratum 1 NTP server configuration

# --- Network time sources (fallback) ---
# These provide sanity-checking and coarse time when GPS has no fix.
# They will never be preferred over PPS when GPS is healthy.
server time.cloudflare.com iburst maxpoll 5
pool us.ntp.ubuntu.com iburst maxsources 1

# --- GPS/PPS refclocks (primary) ---
# NMEA coarse time from gpsd via SOCK (Unix domain socket).
# On the tested Pi 5 / Ubuntu 24.04 / gpsd 3.25 build, gpsd delivered usable
# serial timing on /run/chrony.ttyAMA0.sock and chronyc sourcestats -v showed
# a near-zero residual offset with offset 0.000. Keep this empirical unless
# you verify the same behavior on your own host.
# noselect: chrony will never sync to this source directly. It exists only
#   to provide second-of-day context for the PPS lock.
refclock SOCK /run/chrony.ttyAMA0.sock refid NMEA offset 0.000 precision 1e-1 delay 0.2 noselect

# PPS read directly from the kernel PPS device, independent of gpsd.
# 'lock NMEA' ties the pulse to the NMEA SOCK source above so chrony knows
# which second the pulse belongs to.
# maxlockage 2: if NMEA goes stale, stop trusting the lock after 2 updates.
# prefer: use this source when healthy, but fall back to network if it fails.
refclock PPS /dev/pps0 refid kPPS lock NMEA maxlockage 2 poll 4 precision 1e-7 prefer

# --- Performance tuning ---
# Lock chrony into RAM, preventing it from being swapped out.
# Results in lower and more consistent latency.
lock_all

# Enable hardware timestamping on all interfaces (Pi 5).
# Improves accuracy for NTP clients syncing from this server.
hwtimestamp *

# Tag NTP packets as Expedited Forwarding (DSCP 48).
# Helps on congested networks.
dscp 48

# Temperature compensation is disabled. Testing showed that tempcomp degrades
# performance in thermally stable environments — chrony's own frequency tracking
# handles drift better than explicit compensation when temperature swings are
# small (<10C). The correction noise exceeds the thermal drift being compensated.
#
# Only consider enabling for environments with large temperature swings (outdoor
# enclosures, unheated spaces). If needed, collect data with
# scripts/collect_tempcomp_data.sh and generate a table with scripts/tempcomp_gen.py.
#
# Note: On Ubuntu 24.04, chrony's systemd sandboxing blocks /sys/class/thermal.
# Use the hwmon path instead. Find your CPU sensor with:
#   for d in /sys/class/hwmon/hwmon*; do echo "$d: $(cat $d/name) = $(cat $d/temp*_input)"; done
#tempcomp /sys/class/hwmon/hwmon0/temp1_input 30 /etc/chrony/chrony.tempcomp

# --- Network access control ---
# Serve time to LAN clients. Adjust to match your subnet.
allow 192.168/16

# Restrict chronyc admin commands to localhost only.
bindcmdaddress 127.0.0.1

# Listen for NTP clients on all interfaces.
bindaddress 0.0.0.0

# --- Source directories ---
sourcedir /run/chrony-dhcp
# /etc/chrony/sources.d is deliberately not loaded. Ubuntu 26.04 ships NTS
# pool servers there marked 'prefer', which would compete with kPPS.

# --- Security ---
keyfile /etc/chrony/chrony.keys
ntsdumpdir /var/lib/chrony

# --- Clock discipline ---
# Store frequency drift data across restarts.
driftfile /var/lib/chrony/chrony.drift

# Allow stepping the clock up to 1 second, but only during the first 3 updates.
# After that, only slew. Handles boot-time where the clock may be far off.
makestep 1 3

# Reject updates where the frequency estimate has >100ppm uncertainty.
maxupdateskew 100.0

# Sync the hardware RTC from system time every 11 minutes.
# Improves time accuracy across reboots.
rtcsync

# Get leap second info from the system timezone database rather than
# relying on NTP servers to announce it.
leapsectz right/UTC

# --- Logging ---
logdir /var/log/chrony

# Enable logging for offset tuning and diagnostics.
log tracking measurements statistics
